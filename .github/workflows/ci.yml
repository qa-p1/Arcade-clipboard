name: Core and desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '3'
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

defaults:
  run:
    shell: bash
    working-directory: App dev/Arcade-clipboard

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - name: Install Rust and native dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libsecret-1-dev libgtk-3-dev
      - name: Documentation, shortcuts and vendored checksums
        run: python3 scripts/check-docs.py
      - run: bash scripts/dev.sh rust-check
      - run: bash scripts/dev.sh rust-test
  linux:
    name: Linux build and AppImage smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust and Linux build dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev libdbus-1-dev libsecret-1-dev desktop-file-utils librsvg2-bin xvfb xauth
      - run: bash scripts/dev.sh flutter-check
      - run: bash scripts/dev.sh flutter-test
      - name: Build Linux release bundle
        run: bash scripts/dev.sh build-linux
      - name: Build pinned AppImage
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          bash scripts/dev.sh build-appimage --version "$release_version"
          sha256sum "dist/Arcade-Clipboard-$release_version-x86_64.AppImage" > "dist/Arcade-Clipboard-$release_version-x86_64.AppImage.sha256"
      - name: Smoke test AppImage CLI under Xvfb
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          appimage="$PWD/dist/Arcade-Clipboard-$release_version-x86_64.AppImage"
          env -u LD_LIBRARY_PATH xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          # xvfb-run appends 2>&1, so keep the answer on its own file.
          env -u LD_LIBRARY_PATH xvfb-run -a sh -c 'APPIMAGE_EXTRACT_AND_RUN=1 "$0" --arcade-manifest > "$1"' "$appimage" "$RUNNER_TEMP/manifest.json"
          manifest="$(cat "$RUNNER_TEMP/manifest.json")"
          printf '%s' "$manifest" | python3 -c 'import json,sys; assert json.load(sys.stdin)["id"] == "arcade.clipboard"' || { printf 'stdout was:\n%s\n' "$manifest" | cat -A | head -40; exit 1; }
      - name: Tray icon registration (real StatusNotifierWatcher, isolated)
        run: |
          sudo apt-get install -y xdotool python3-dbus python3-gi dbus-x11
          git -c advice.detachedHead=false clone -q --depth 1 --branch v0.3.0 https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
          cargo build --release --manifest-path "$RUNNER_TEMP/link/Cargo.toml" -p arcade-link-cli
          /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- /usr/bin/python3 tests/tray-registration.py apps/flutter_app/build/linux/x64/release/bundle/clipboard "$RUNNER_TEMP/link/target/release/arcade-link" clipboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arcade-Clipboard-linux-x64
          path: |
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-linux-x64.tar.gz
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-linux-x64.tar.gz.sha256
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-*.AppImage
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows build and installer smoke (CI only, not a real desktop)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler is missing' }
      - name: Test Rust core and build the Flutter desktop app with its core
        run: |
          python3 scripts/check-docs.py
          bash scripts/dev.sh rust-test
          bash scripts/dev.sh build-windows
      - name: Package Windows Inno installer
        id: windows-package
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          python3 scripts/package-desktop.py --version "$release_version" --platform windows
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
      - name: Test Windows installation and uninstallation (CI only, not a real desktop)
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.windows-package.outputs.version }}
        run: |
          pwsh -NoProfile -File scripts/test-windows-installer.ps1 -Version $env:INSTALLER_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer lifecycle checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Arcade-Clipboard-windows-installer
          path: App dev/Arcade-clipboard/dist/packages/Arcade-Clipboard_*_windows_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build and DMG install smoke (CI only, not a real desktop)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test Rust core and build the Flutter desktop app with its core
        run: |
          python3 scripts/check-docs.py
          bash scripts/dev.sh rust-test
          bash scripts/dev.sh build-macos
      - name: Package and smoke-test macOS DMG (CI only, not a real desktop)
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          python3 scripts/package-desktop.py --version "$release_version" --platform macos
          images=(dist/packages/Arcade-Clipboard_*_macos_*.dmg)
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          bash scripts/verify-dmg.sh "${images[0]}" "$release_version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Arcade-Clipboard-macos-dmg
          path: App dev/Arcade-clipboard/dist/packages/Arcade-Clipboard_*_macos_*.dmg
          if-no-files-found: error
          retention-days: 14
