name: Core and desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Called from release.yml, github.workflow is the caller's name, so the
  # release's build no longer cancels (or is cancelled by) the push run.
  # The literal ci- prefix keeps it apart from release.yml's own group.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

defaults:
  run:
    shell: bash
    working-directory: App dev/Arcade-clipboard

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - name: Install Rust and native dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libsecret-1-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: App dev/Arcade-clipboard -> target
      - name: Docs, vendored checksums, rustfmt, clippy and tests
        run: bash scripts/check rust
  linux:
    name: Linux build and AppImage smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust and Linux build dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev libdbus-1-dev libsecret-1-dev desktop-file-utils librsvg2-bin xvfb xauth
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: App dev/Arcade-clipboard -> target
      - name: Dart format, flutter analyze and tests
        run: bash scripts/check flutter
      - name: Build Linux release bundle
        run: bash scripts/dev build-linux
      - name: Build pinned AppImage
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          bash scripts/dev build-appimage --version "$release_version"
          sha256sum "dist/Arcade-Clipboard-$release_version-x86_64.AppImage" > "dist/Arcade-Clipboard-$release_version-x86_64.AppImage.sha256"
      - name: Smoke test AppImage CLI under Xvfb
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          appimage="$PWD/dist/Arcade-Clipboard-$release_version-x86_64.AppImage"
          env -u LD_LIBRARY_PATH xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          # xvfb-run appends 2>&1, so keep the answer on its own file.
          env -u LD_LIBRARY_PATH xvfb-run -a sh -c 'APPIMAGE_EXTRACT_AND_RUN=1 "$0" --arcade-manifest > "$1"' "$appimage" "$RUNNER_TEMP/manifest.json"
          manifest="$(cat "$RUNNER_TEMP/manifest.json")"
          printf '%s' "$manifest" | python3 -c 'import json,sys; assert json.load(sys.stdin)["id"] == "arcade.clipboard"' || { printf 'stdout was:\n%s\n' "$manifest" | cat -A | head -40; exit 1; }
      - name: Prepare pinned isolated lifecycle runner
        run: |
          sudo apt-get install -y xdotool python3-dbus python3-gi dbus-x11 gnome-keyring
          git -c advice.detachedHead=false clone -q --depth 1 --branch v0.3.0 https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
          cargo build --release --manifest-path "$RUNNER_TEMP/link/Cargo.toml" -p arcade-link-cli
      - name: AppImage install, repair and uninstall (isolated D-Bus and Xvfb)
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- xvfb-run -a /usr/bin/python3 scripts/verify-appimage.py \
            "$PWD/dist/Arcade-Clipboard-$release_version-x86_64.AppImage" "$release_version"
      - name: Tray icon registration (real StatusNotifierWatcher, isolated)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            platform/desktop/arcade_desktop_bridge/linux/tests/lifecycle_bridge_test.cc \
            -Iapps/flutter_app/linux/flutter/ephemeral -Lapps/flutter_app/linux/flutter/ephemeral \
            -Wl,-rpath,"$PWD/apps/flutter_app/linux/flutter/ephemeral" \
            -lflutter_linux_gtk $(pkg-config --cflags --libs gtk+-3.0 gio-2.0) \
            -o "$RUNNER_TEMP/lifecycle_bridge_test"
          /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- "$RUNNER_TEMP/lifecycle_bridge_test"
          /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- /usr/bin/python3 tests/tray-registration.py apps/flutter_app/build/linux/x64/release/bundle/clipboard "$RUNNER_TEMP/link/target/release/arcade-link" clipboard
      - name: Folder move from 0.2 (isolated)
        run: /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- xvfb-run -a /usr/bin/python3 tests/folder-migration.py apps/flutter_app/build/linux/x64/release/bundle/clipboard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arcade-Clipboard-linux-x64
          path: |
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-linux-x64.tar.gz
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-linux-x64.tar.gz.sha256
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-*.AppImage
            App dev/Arcade-clipboard/dist/Arcade-Clipboard-*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android release build and signing check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
      ANDROID_NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust, the Android targets and the NDK
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: App dev/Arcade-clipboard -> target
      - name: Build the Rust core for Android
        run: python3 scripts/build-android-core.py
      - name: Release key (the CI secret, or a throwaway key where secrets are unavailable)
        env:
          KEYSTORE: ${{ secrets.ARCADE_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ARCADE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCADE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARCADE_ANDROID_KEY_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/release.jks"
          if [[ -n "$KEYSTORE" ]]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$store"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"; KEY_PASSWORD="$KEYSTORE_PASSWORD"; KEY_ALIAS=ci
            keytool -genkeypair -keystore "$store" -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 \
              -validity 30 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Arcade Clipboard CI" > /dev/null
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "ARCADE_ANDROID_KEYSTORE_FILE=$store"
            echo "ARCADE_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ARCADE_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ARCADE_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: App dev/Arcade-clipboard/apps/flutter_app
        run: flutter pub get --enforce-lockfile && flutter build apk --release
      - name: The APK is signed with the release key, not the debug key (C2)
        run: |
          apk=apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$certs" | grep 'certificate DN'
          expected="$(keytool -list -v -keystore "$ARCADE_ANDROID_KEYSTORE_FILE" -storepass "$ARCADE_ANDROID_KEYSTORE_PASSWORD" -alias "$ARCADE_ANDROID_KEY_ALIAS" | sed -n 's/^.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')"
          printf '%s\n' "$certs" | grep -q "certificate SHA-256 digest: $expected" || { echo "the APK isn't signed with the release key"; exit 1; }
          ! printf '%s\n' "$certs" | grep -q 'CN=Android Debug' || { echo 'the APK is signed with the debug key'; exit 1; }

  windows:
    name: Windows build and installer smoke (CI only, not a real desktop)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: App dev/Arcade-clipboard -> target
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup compiler is missing' }
      - name: Test Rust core and build the Flutter desktop app with its core
        run: |
          python3 scripts/check-docs.py
          bash scripts/dev rust-test
          bash scripts/dev build-windows
      - name: Package Windows Inno installer
        id: windows-package
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          python3 scripts/package-desktop.py --version "$release_version" --platform windows
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
      - name: Test Windows installation and uninstallation (CI only, not a real desktop)
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ steps.windows-package.outputs.version }}
        run: |
          pwsh -NoProfile -File scripts/test-windows-installer.ps1 -Version $env:INSTALLER_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer lifecycle checks failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Arcade-Clipboard-windows-installer
          path: App dev/Arcade-clipboard/dist/packages/Arcade-Clipboard_*_windows_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build and DMG install smoke (CI only, not a real desktop)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: App dev/Arcade-clipboard -> target
      - name: Test Rust core and build the Flutter desktop app with its core
        run: |
          python3 scripts/check-docs.py
          bash scripts/dev rust-test
          bash scripts/dev build-macos
      - name: Package and smoke-test macOS DMG (CI only, not a real desktop)
        run: |
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          python3 scripts/package-desktop.py --version "$release_version" --platform macos
          images=(dist/packages/Arcade-Clipboard_*_macos_*.dmg)
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          bash scripts/verify-dmg.sh "${images[0]}" "$release_version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Arcade-Clipboard-macos-dmg
          path: App dev/Arcade-clipboard/dist/packages/Arcade-Clipboard_*_macos_*.dmg
          if-no-files-found: error
          retention-days: 14
