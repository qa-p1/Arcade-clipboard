name: Core and Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust and native dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libsecret-1-dev
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2021 --check core/rust/src/core_helpers.rs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust and Linux build dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev libdbus-1-dev libsecret-1-dev
      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: apps/flutter_app
      - run: flutter analyze
        working-directory: apps/flutter_app
      - run: flutter test
        working-directory: apps/flutter_app
      - name: Build and package Linux release
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arcade-Clipboard-linux-x64
          path: |
            dist/Arcade-Clipboard-linux-x64.tar.gz
            dist/Arcade-Clipboard-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
