# Builds every desktop platform once from a release-candidate tag and publishes the files as a hidden prerelease on
# the test channel (Link's reusable publish: arcade-release.json with the Inno installer's switches, and an unsigned
# manifest.json). "Tag a release" starts it; it can also be run by hand on an rc tag. Every exit gate runs against the
# published files; "Promote" then republishes the same bytes as stable with a signed manifest. Nothing here
# publishes stable (PLAN.md rule zero); nightlies come from nightly.yml.
name: Desktop releases

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '3'
  CMAKE_BUILD_PARALLEL_LEVEL: '3'
  RUSTUP_TOOLCHAIN: '1.98.1'

defaults:
  run:
    shell: bash
    working-directory: App dev/Arcade-clipboard

concurrency:
  group: clipboard-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - name: The tag is this version's release candidate
        id: release
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          flutter=$(sed -nE 's/^version: ([^+]+).*/\1/p' apps/flutter_app/pubspec.yaml)
          [ "$flutter" = "$version" ] || { echo "::error::pubspec.yaml has $flutter, Cargo.toml has $version"; exit 1; }
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* && "$tag" =~ ^v${version//./\\.}-rc\.[1-9][0-9]*$ ]] \
            || { echo "::error::run Release on a tag v$version-rc.N (got $GITHUB_REF)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  packages:
    needs: prepare
    env:
      ARCADE_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-latest, platform: windows}
          - {os: macos-latest, platform: macos}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: App dev/Arcade-clipboard
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if [[ "$RUNNER_OS" == macOS ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libkeybinder-3.0-dev libdbus-1-dev libsecret-1-dev desktop-file-utils librsvg2-bin
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build desktop app and Rust core
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/dev "build-$PLATFORM"
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/dev build-appimage --version "$RELEASE_VERSION"
      - name: Package Linux assets, Inno installer, or dmg
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/package-desktop.py --version "$RELEASE_VERSION" --platform "$PLATFORM"
      - name: Smoke-test the release DMG before upload
        if: matrix.platform == 'macos'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bundle_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          bash scripts/verify-dmg.sh "dist/packages/Arcade-Clipboard_${RELEASE_VERSION}_macos_universal.dmg" "$bundle_version" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: App dev/Arcade-clipboard/dist/packages/*
          if-no-files-found: error

  publish:
    needs: [prepare, ci, packages]
    permissions:
      contents: write
    uses: qa-p1/Arcade-Link/.github/workflows/app-publish.yml@v1.0.13
    with:
      app: arcade.clipboard
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: test
      artifacts: release-*
      windows-installer: inno
      link-ref: v1.0.13
