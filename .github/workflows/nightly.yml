# Nightly: main CI's already-tested packages (artifacts Arcade-Clipboard-*) as a signed prerelease
# vX.Y.Z-nightly.YYYYMMDD.N, with no rebuild. Skipped when main hasn't changed or its CI isn't green.
name: Nightly
on:
  schedule: [{ cron: "23 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"
  nightly:
    needs: version
    uses: qa-p1/Arcade-Link/.github/workflows/app-nightly.yml@v1.0.13
    with:
      app: arcade.clipboard
      version: ${{ needs.version.outputs.version }}
      artifacts: Arcade-Clipboard-*
      windows-installer: inno
      link-ref: v1.0.13
    secrets:
      ARCADE_UPDATE_SIGNING_KEY: ${{ secrets.ARCADE_UPDATE_SIGNING_KEY }}
