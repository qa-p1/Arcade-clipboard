# Creates an annotated version tag on a commit that is already on main, after
# checking it matches the app version in Cargo.toml and pubspec.yaml. Then run
# "Release" on the tag with channel "stable" (Actions → Run workflow → the tag)
# to build, test and publish the release.
name: Tag a release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.2.3
        required: true
      sha:
        description: Full SHA of a commit on main
        required: true
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Create and push the tag
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main"; exit 1; }
          v=$(git show "$SHA:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')
          f=$(git show "$SHA:apps/flutter_app/pubspec.yaml" | sed -nE 's/^version: ([^+]+).*/\1/p')
          [ "$v" = "${TAG#v}" ] || { echo "version at $SHA is $v, not ${TAG#v}"; exit 1; }
          [ "$f" = "$v" ] || { echo "pubspec.yaml has $f, Cargo.toml has $v"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Arcade Clipboard ${TAG#v}" -m "See CHANGELOG.md."
          git push origin "refs/tags/$TAG"
