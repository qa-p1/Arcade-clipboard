services:
  relay:
    build:
      context: ../..
      dockerfile: services/relay/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    environment:
      ARCADE_RELAY_BIND: 0.0.0.0:8787
      # Caddy is the sole TCP peer. This is an aggregate proxy limit.
      ARCADE_RELAY_MAX_CONNECTIONS_PER_IP: '512'
    networks: [relay]
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in deploy/relay/.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in deploy/relay/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay]
    depends_on:
      relay:
        condition: service_healthy
networks:
  relay:
volumes:
  caddy_data:
  caddy_config:
