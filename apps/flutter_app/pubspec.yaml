name: arcade_clipboard
description: A calm, private clipboard mesh for your devices.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  file_selector: ^1.1.0
  clipboard_watcher: ^0.3.0
  hotkey_manager: ^0.2.3
  image: ^4.10.1
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  window_manager: ^0.5.2
  zxing2: ^0.2.4
  arcade_desktop_bridge:
    path: ../../platform/desktop/arcade_desktop_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
