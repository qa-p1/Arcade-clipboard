[workspace]
members = ["core/rust", "services/relay", "tests/driver"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
# Arcade Link (the shared protocol), pinned to a release tag. To build
# against a local checkout instead, add to .cargo/config.toml (not committed):
#   [patch."https://github.com/qa-p1/Arcade-Link"]
#   arcade-link = { path = "<path to>/Arcade-link/crates/arcade-link" }
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", tag = "v0.2.0", features = ["watch"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
